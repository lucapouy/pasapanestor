
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasapalabra | Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="contenedor">

        <header class="logo">
            <div class="rosco">
                <span>P</span>
                <span>A</span>
                <span>S</span>
                <span>A</span>
                <span>P</span>
                <span>A</span>
                <span>L</span>
                <span>A</span>
                <span>B</span>
                <span>R</span>
                <span>A</span>
            </div>

            <h1>PASAPALABRA</h1>
            <p>UN ROSCO, MIL RESPUESTAS</p>
        </header>

        <section class="login">

            <h2>Crear cuenta</h2>

            <p class="descripcion">
                Registrate y preparate para completar el rosco.
            </p>

            <form action="menu.html" method="get">

                <input
                    type="text"
                    name="nombre"
                    placeholder="Nombre completo"
                    required
                >

                <input
                    type="text"
                    name="usuario"
                    placeholder="Nombre de usuario"
                    required
                >

                <input
                    type="email"
                    name="correo"
                    placeholder="Correo electrónico"
                    required
                >

                <input
                    type="password"
                    name="contrasena"
                    placeholder="Crear contraseña"
                    minlength="6"
                    required
                >

                <input
                    type="password"
                    name="confirmar"
                    placeholder="Confirmar contraseña"
                    minlength="6"
                    required
                >

                <button type="submit" class="btn-login">
                    CREAR CUENTA
                </button>

            </form>

            <p class="registro">
                ¿Ya tenés una cuenta?
                <a href="index.html">Iniciar sesión</a>
            </p>

        </section>

        <footer>
            <p>© 2026 PASAPALABRA - TODOS LOS DERECHOS RESERVADOS</p>
        </footer>

    </main>

</body>
</html>

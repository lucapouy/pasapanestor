
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasapalabra | Inicio de sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="contenedor">

        <header class="logo">
            <div class="rosco">
                <span>P</span>
                <span>A</span>
                <span>S</span>
                <span>A</span>
                <span>P</span>
                <span>A</span>
                <span>L</span>
                <span>A</span>
                <span>B</span>
                <span>R</span>
                <span>A</span>
            </div>

            <h1>PASAPALABRA</h1>
            <p>UN ROSCO, MIL RESPUESTAS</p>
        </header>

        <section class="login">

            <h2>¡Bienvenido!</h2>

            <p class="descripcion">
                Preparáte para poner a prueba tus conocimientos.
                ¿Estás listo para completar el rosco?
            </p>

            <form action="menu.html" method="get">

                <input
                    type="text"
                    name="usuario"
                    placeholder="Nombre de usuario"
                    required
                >

                <input
                    type="password"
                    name="contrasena"
                    placeholder="Contraseña"
                    required
                >

                <button type="submit" class="btn-login">
                    INICIAR SESIÓN
                </button>

            </form>

            <div class="separador">
                <span></span>
                O TAMBIÉN
                <span></span>
            </div>

            <a href="menu.html" class="btn-invitado">
                <span>▶</span> ENTRAR COMO INVITADO
            </a>

            <p class="registro">
                ¿No tenés cuenta?
                <a href="registro.html">Registrate</a>
            </p>

        </section>

        <footer>
            <p>© 2026 PASAPALABRA - TODOS LOS DERECHOS RESERVADOS</p>
        </footer>

    </main>

</body>
</html>
